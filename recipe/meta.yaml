{% set name = "perl-yaml" %}
{% set version = "1.321" %}
{% set sha256 = "d461167b8b4aa9244f736a7a740830141e61dddee301e456bf642e81d3cea193" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/T/TI/TINITA/YAML-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-test-deep
    - perl-test-yaml
  run:
    - perl

test:
  imports:
    - YAML

about:
  home: https://github.com/ingydotnet/yaml-pm
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file: LICENSE
  summary: "YAML Ain't Markup Language™"

extra:
  recipe-maintainers:
    - xileF1337
    - cbrueffer
